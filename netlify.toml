# Netlify 部署配置
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA 路由回退（本地开发可用 npm run dev）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 缓存策略：SW 与 HTML 永不缓存（保证新版本立即生效），hash 资源长缓存
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

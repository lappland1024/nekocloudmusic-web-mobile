# Netlify 部署配置
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA 路由回退（本地开发可用 npm run dev）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 缓存全面禁用：任何资源都不缓存，永远拉最新
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
